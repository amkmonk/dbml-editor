server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        text/plain dbml txt;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
