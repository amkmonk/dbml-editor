[package]
name = "dbml-editor"
version = "0.3.2"
description = "Редактор DBML-диаграмм"
authors = ["Александр Кондрашов"]
license = ""
repository = "https://github.com/amkmonk/dbml-editor"
edition = "2021"
rust-version = "1.77.2"


[lib]
name = "dbml_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
