name: release

# Тег v* — сборка и релиз на GitHub. Ручной запуск (Actions → release → Run workflow) —
# только сборка: файлы лежат в артефактах запуска.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - run: npm test
      - run: node scripts/build.mjs ${{ matrix.os }}

      - uses: actions/upload-artifact@v4
        with:
          name: dbml-editor-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: release/*
          body: |
            Windows: `-setup.exe` — установщик, `-portable.exe` — запуск без установки (нужен WebView2, в Windows 10 и 11 он обычно есть).
            Linux: `.deb` для Debian и Ubuntu, `.AppImage` — один файл без установки (`chmod +x`).
